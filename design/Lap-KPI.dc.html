<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Laporan KPI</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0A57A8}a:hover{color:#063E7A}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F2F3EF; font-family: 'IBM Plex Sans', sans-serif; color: #16191D; overflow: hidden">
  <header style="padding: 20px 20px 12px; display: flex; flex-direction: column; gap: 12px; background: #FFFFFF; border-bottom: 1px solid #DADDD6">
    <div style="display: flex; align-items: center; gap: 8px">
      <a href="Laporan-Menu.dc.html" aria-label="Kembali" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #16191D"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
      <div style="flex: 1; display: flex; flex-direction: column">
        <span style="font-size: 12px; font-weight: 600; color: #545B63; letter-spacing: 0.06em; text-transform: uppercase">Laporan · Jakarta</span>
        <h1 style="margin: 0; font-size: 20px; font-weight: 700">KPI Gudang</h1>
      </div>
      <button style="height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid #16191D; background: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600; color: #16191D; display: inline-flex; align-items: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"></path><path d="M14 3v5h5M9 12l5 5M14 12l-5 5"></path></svg>Excel</button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; padding: 4px; border-radius: 12px; background: #F2F3EF" role="group" aria-label="Periode">
      <button style="height: 36px; border-radius: 9px; border: none; background: #16191D; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600">Bulan</button>
      <button style="height: 36px; border-radius: 9px; border: none; background: transparent; color: #16191D; font-family: inherit; font-size: 13px; font-weight: 500">Quartal</button>
      <button style="height: 36px; border-radius: 9px; border: none; background: transparent; color: #16191D; font-family: inherit; font-size: 13px; font-weight: 500">Semester</button>
    </div>
    <div role="tablist" aria-label="Jenis KPI" style="display: flex; gap: 6px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
        <button role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>
  </header>

  <main style="flex: 1; overflow: hidden; padding: 14px 20px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: #545B63; text-transform: uppercase; letter-spacing: 0.04em"><span>{{cur.heading}}</span><span>{{cur.pctLabel}}</span></div>
    <sc-for list="{{cur.rows}}" as="r" hint-placeholder-count="6">
      <article style="{{r.cardStyle}}">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
          <span style="font-size: 13px; font-weight: 700">{{r.name}}</span>
          <span style="{{r.pctStyle}}">{{r.pct}}</span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 11px">
          <span style="display: flex; flex-direction: column"><span style="font-family: 'IBM Plex Sans', sans-serif; font-size: 10px; color: {{r.subColor}}; font-weight: 600">{{cur.labelA}}</span><span style="font-size: 13px; font-weight: 600">{{r.aS}} sak</span><span style="color: {{r.subColor}}">{{r.aK}} KG</span></span>
          <span style="display: flex; flex-direction: column"><span style="font-family: 'IBM Plex Sans', sans-serif; font-size: 10px; color: {{r.subColor}}; font-weight: 600">{{cur.labelB}}</span><span style="font-size: 13px; font-weight: 600">{{r.bS}} sak</span><span style="color: {{r.subColor}}">{{r.bK}} KG</span></span>
        </div>
      </article>
    </sc-for>
    <span style="font-size: 11px; color: #545B63">{{cur.foot}}</span>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { tab: 0 };
}
renderVals() {
const f = (n) => n.toLocaleString('id-ID', { maximumFractionDigits: 0 });
const pct = (a, b) => (a ? ((b - a) / a * 100) : null);
const sets = [
{ label: 'Inbound', heading: 'Inbound per item grup', labelA: 'AGUSTUS', labelB: 'SEPTEMBER', pctLabel: 'Perubahan', foot: 'Pembandingan = (Sep − Agu) ÷ Agu, dari qty sak.', rows: [
['HENAN', 29194, 589784, 45266, 907228], ['KATING', 15610, 312497, 11711, 231691], ['BOMBAY NZ', 6373, 127678, 21958, 439537],
['BOMBAY INDIA', 12749, 114741, 0, 0], ['BAWANG TUNGGAL', 920, 9200, 3499, 35010], ['TOTAL', 63926, 1144700, 78935, 1578456]
] },
{ label: 'Outbound', heading: 'Outbound per item grup', labelA: 'SEPTEMBER', labelB: 'OKTOBER (S.D. 08)', pctLabel: 'Perubahan', foot: 'Oktober baru berjalan 8 hari, jadi penurunan belum bisa dibandingkan penuh.', rows: [
['HENAN', 49942, 1003788, 1880, 29580], ['KATING', 13211, 262024, 1050, 20707], ['BAWANG TUNGGAL', 168, 1680, 611, 6110],
['TOTAL', 63321, 1267492, 3541, 56397]
] },
{ label: 'Retur', heading: 'Retur September', labelA: 'RETUR', labelB: 'OUTBOUND', pctLabel: 'Rasio retur', ratio: true, foot: 'Rasio retur = retur ÷ outbound bulan yang sama, dari qty sak.', rows: [
['HENAN', 680, 13186, 49942, 1003788], ['KATING', 30, 593, 13211, 262024], ['BAWANG TUNGGAL', 10, 0, 168, 1680], ['TOTAL', 720, 13778, 63321, 1267492]
] },
{ label: 'IN vs OUT', heading: 'September · inbound vs outbound', labelA: 'INBOUND', labelB: 'OUTBOUND', pctLabel: 'Selisih', inout: true, foot: 'Positif = lebih banyak keluar (Banyak OUT).', rows: [
['HENAN', 45266, 907228, 49942, 1003788], ['KATING', 11711, 231691, 13211, 262024], ['BAWANG TUNGGAL', 3499, 35010, 168, 1680],
['TOTAL', 60476, 1173929, 63321, 1267492]
] }
];
const s = sets[this.state.tab];
const tabBase = 'height: 36px; padding: 0 12px; border-radius: 18px; font-family: inherit; font-size: 13px; cursor: pointer; white-space: nowrap;';
const tabs = sets.map((x, i) => ({
label: x.label,
on: i === this.state.tab,
style: tabBase + (i === this.state.tab ? ' border: none; background: #16191D; color: #FFFFFF; font-weight: 600;' : ' border: 1px solid #DADDD6; background: #FFFFFF; color: #16191D; font-weight: 500;'),
pick: () => this.setState({ tab: i })
}));
const rows = s.rows.map((r) => {
const total = r[0] === 'TOTAL';
let txt, up;
if (s.ratio) { const v = r[3] ? r[1] / r[3] * 100 : 0; txt = v.toLocaleString('id-ID', { maximumFractionDigits: 1 }) + '%'; up = null; }
else { const p = pct(r[1], r[3]); up = p === null ? null : p >= 0; txt = p === null ? 'baru' : (p >= 0 ? '▲ ' : '▼ ') + Math.abs(p).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + '%'; if (s.inout) txt += up ? ' · OUT' : ' · IN'; }
const pc = up === null ? ['#ECEDE8', '#3D4349'] : up ? ['#E6EEF8', '#0A57A8'] : ['#FBEDE5', '#8A2E08'];
return {
name: r[0], aS: f(r[1]), aK: f(r[2]), bS: f(r[3]), bK: f(r[4]), pct: txt,
subColor: total ? '#C5CAD1' : '#545B63',
pctStyle: 'padding: 3px 8px; border-radius: 6px; font-family: \'IBM Plex Mono\', monospace; font-size: 12px; font-weight: 600; background: ' + pc[0] + '; color: ' + pc[1],
cardStyle: 'border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; ' + (total ? 'background: #16191D; color: #FFFFFF;' : 'background: #FFFFFF; border: 1px solid #DADDD6;')
};
});
return { tabs, cur: Object.assign({}, s, { rows }) };
}
}
</script>
</body>
</html>
