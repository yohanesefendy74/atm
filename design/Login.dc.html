<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Login Level UP</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1E0296}a:hover{color:#14016A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; font-family: 'IBM Plex Sans', sans-serif; color: #16191D; padding: 72px 24px 40px">
  <img src="/_blob/140abbe09d2fbc4a09258cdc58256d27" alt="Level UP" style="width: 300px; height: auto; align-self: center">

  <form style="margin-top: 48px; display: flex; flex-direction: column; gap: 16px">
    <label style="display: flex; align-items: center; gap: 12px">
      <span style="width: 104px; flex-shrink: 0; font-size: 15px">UserName</span>
      <input type="text" autocomplete="username" value="ADMIN" style="flex: 1; min-width: 0; height: 48px; padding: 0 12px; border-radius: 6px; border: 1.5px solid #1E0296; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #16191D">
    </label>
    <div style="display: flex; align-items: center; gap: 12px">
      <label for="pwd" style="width: 104px; flex-shrink: 0; font-size: 15px">Password</label>
      <div style="flex: 1; min-width: 0; display: flex; align-items: center; height: 48px; border-radius: 6px; border: 1px solid #A8ABB0; background: #FFFFFF">
        <input id="pwd" type="{{pwType}}" autocomplete="current-password" placeholder="Password" value="" style="flex: 1; min-width: 0; height: 100%; padding: 0 12px; border: none; background: transparent; font-family: inherit; font-size: 16px; color: #16191D; outline: none">
        <button type="button" onClick="{{toggle}}" aria-label="{{eyeLabel}}" style="width: 48px; height: 46px; border: none; background: #E4E1F0; border-radius: 0 5px 5px 0; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #16191D">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
      </div>
    </div>
    <label style="display: flex; align-items: center; gap: 12px">
      <span style="width: 104px; flex-shrink: 0; font-size: 15px">Language</span>
      <select style="flex: 1; min-width: 0; height: 48px; padding: 0 10px; border-radius: 6px; border: 1px solid #A8ABB0; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #16191D"><option>English</option><option>Bahasa Indonesia</option></select>
    </label>
    <label style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 15px; color: #1E0296">
      <input type="checkbox" style="width: 20px; height: 20px; margin: 0; accent-color: #1E0296">
      Remember me
    </label>

    <a href="Main.dc.html" style="height: 52px; margin-top: 8px; border-radius: 10px; background: #D51F26; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; text-decoration: none">Login</a>
    <a href="#" style="height: 52px; border-radius: 10px; background: #19037B; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; text-decoration: none">Change Password</a>
    <a href="#" style="align-self: center; min-height: 44px; padding: 0 16px; display: flex; align-items: center; font-size: 16px; font-weight: 700; text-decoration: none; color: #1E0296">Exit</a>
  </form>

  <span style="margin-top: auto; text-align: center; font-size: 12px; color: #545B63">Cabang dari akun · pilihan warehouse sesuai hak akses · Gudang ATM</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { show: false };
}
renderVals() {
const s = this.state.show;
return {
pwType: s ? 'text' : 'password',
eyeLabel: s ? 'Sembunyikan password' : 'Tampilkan password',
toggle: () => this.setState({ show: !s })
};
}
}
</script>
</body>
</html>
