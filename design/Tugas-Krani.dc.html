<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Tugas Krani</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0A57A8}a:hover{color:#063E7A}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F2F3EF; font-family: 'IBM Plex Sans', sans-serif; color: #16191D; overflow: hidden">
  <header style="padding: 20px 20px 12px; display: flex; flex-direction: column; gap: 12px; background: #FFFFFF; border-bottom: 1px solid #DADDD6">
    <div style="display: flex; align-items: center; gap: 8px">
      <a href="Main.dc.html" aria-label="Kembali ke beranda" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #16191D"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
      <div style="flex: 1; display: flex; flex-direction: column">
        <span style="font-size: 12px; font-weight: 600; color: #545B63; letter-spacing: 0.06em; text-transform: uppercase">Dari Admin · ditugaskan ke Anda</span>
        <h1 style="margin: 0; font-size: 20px; font-weight: 700">Tugas saya</h1>
      </div>
    </div>
    <div role="tablist" aria-label="Jenis dokumen" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 4px; border-radius: 12px; background: #ECEDE8">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
        <button role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 14px 20px 20px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{docs}}" as="d" hint-placeholder-count="3">
      <a href="{{d.href}}" style="display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; background: #FFFFFF; border: 1px solid #DADDD6; border-radius: 16px; text-decoration: none; color: #16191D">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
          <span style="{{d.noStyle}}">{{d.no}}</span>
          <span style="{{d.stStyle}}">{{d.st}}</span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 12px; font-size: 13px">
          <span style="display: flex; flex-direction: column"><span style="font-size: 11px; color: #545B63">Rencana</span><span style="font-weight: 600">{{d.tgl}}</span></span>
          <span style="display: flex; flex-direction: column"><span style="font-size: 11px; color: #545B63">Warehouse</span><span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600">{{d.wh}}</span></span>
          <span style="display: flex; flex-direction: column"><span style="font-size: 11px; color: #545B63">Kendaraan (pos timbang)</span><span style="font-family: 'IBM Plex Mono', monospace">{{d.mobil}}</span></span>
          <span style="display: flex; flex-direction: column"><span style="font-size: 11px; color: #545B63">Barang</span><span style="font-family: 'IBM Plex Mono', monospace">{{d.qty}}</span></span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <div style="height: 6px; border-radius: 3px; background: #ECEDE8; overflow: hidden"><div style="{{d.bar}}"></div></div>
          <div style="display: flex; justify-content: space-between; font-size: 12px; color: #545B63"><span>{{d.prog}}</span><span>Tim: {{d.team}}</span></div>
        </div>
      </a>
    </sc-for>
    <p style="margin: 4px 0 0; font-size: 12px; color: #545B63; text-align: center">Hanya dokumen yang di-assign Admin ke akun Anda yang tampil.</p>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { tab: 'SPBB' };
}
renderVals() {
const all = {
SPBB: [
{ no: 'SPBB/2610/0012', st: 'Partial', tgl: '13 Okt · 08:00', wh: 'WH-JKT01', mobil: 'B 9123 KXT · masuk 10:42', qty: '3 item · 45.000 KG', done: 89, prog: '40.000 / 45.000 KG · sisa 5.000 (1 item)', team: 'Anda, ELLY', href: 'Inbound-Header.dc.html' },
{ no: 'SPBB/2610/0013', st: 'Belum mulai', tgl: '13 Okt · 13:00', wh: 'WH-JKT02', mobil: 'tanpa timbangan · isi sendiri', qty: '1 item · 27.000 KG', done: 0, prog: 'Belum ada barang diterima', team: 'Anda', href: 'Inbound-Header.dc.html' },
{ no: 'SPBB/2610/0009', st: 'Menunggu bongkar', tgl: '12 Okt · 15:30', wh: 'WH-JKT01', mobil: 'kontainer di YARD-A02', qty: '2 item · 26.000 KG', done: 0, prog: 'Kontainer ditinggal masih berisi', team: 'Anda, ANDIKA', href: 'Kontainer-Yard.dc.html' }
],
SPMB: [
{ no: 'SPMB/2610/0021', st: 'Dikerjakan', tgl: '13 Okt · 09:00', wh: 'WH-JKT01', mobil: 'B 9555 KLA · masuk 10:50', qty: '2 item · 25.000 KG', done: 40, prog: '8 / 20 palet discan', team: 'Anda, CHESYA', href: 'Outbound-Header.dc.html' },
{ no: 'SPMB/2610/0022', st: 'Belum mulai', tgl: '13 Okt · 14:00', wh: 'WH-JKT02', mobil: 'tanpa timbangan · isi sendiri', qty: '1 item · 10.000 KG', done: 0, prog: '0 / 8 palet discan', team: 'Anda', href: 'Outbound-Header.dc.html' }
]
};
const accent = this.state.tab === 'SPBB' ? '#0A57A8' : '#B93E0B';
const stc = { 'Dikerjakan': ['#E6EEF8', '#0A57A8'], 'Partial': ['#FFF4D6', '#7A5300'], 'Belum mulai': ['#ECEDE8', '#16191D'], 'Menunggu bongkar': ['#FFF4D6', '#5C3F00'] };
const tabs = ['SPBB', 'SPMB'].map((k) => ({
label: (k === 'SPBB' ? 'Inbound · SPBB ' : 'Outbound · SPMB ') + all[k].length,
on: this.state.tab === k,
style: 'min-height: 42px; border-radius: 9px; border: none; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; ' + (this.state.tab === k ? 'background: #16191D; color: #FFFFFF;' : 'background: transparent; color: #16191D;'),
pick: () => this.setState({ tab: k })
}));
const docs = all[this.state.tab].map((d) => Object.assign({}, d, {
noStyle: 'font-family: \'IBM Plex Mono\', monospace; font-size: 15px; font-weight: 600; color: ' + accent,
stStyle: 'padding: 3px 10px; border-radius: 10px; font-size: 12px; font-weight: 600; background: ' + stc[d.st][0] + '; color: ' + stc[d.st][1],
bar: 'height: 6px; width: ' + d.done + '%; background: ' + accent
}));
return { tabs, docs };
}
}
</script>
</body>
</html>
