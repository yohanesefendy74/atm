name: Build aplikasi Gudang ATM (Android APK + iOS)

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'

      # Membuat file platform Android yang belum ada (AndroidManifest.xml milik project tetap dipakai)
      - run: flutter create --org com.levelup --project-name gudang_atm --platforms=android .

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build APK (error diringkas ke anotasi)
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log || {
            echo "::error title=APK build gagal::$(grep -B2 -A14 -E 'What went wrong|error:|Error:|FAILURE' build.log | head -60 | sed 's/%/%25/g' | tr '\n' '|')"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: gudang-atm-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

  ios:
    # Build iPhone TANPA tanda tangan (hanya membuktikan kode bisa dikompilasi).
    # Untuk dipasang di iPhone butuh Apple Developer Program + tanda tangan (lihat docs/MOBILE.md).
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
      - run: flutter create --org com.levelup --project-name gudang_atm --platforms=ios .
      - name: Target minimum iOS 13 (dibutuhkan plugin printer/Bluetooth)
        run: |
          sed -i '' "s/^# platform :ios.*/platform :ios, '13.0'/" ios/Podfile
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 1[0-2]\.0/IPHONEOS_DEPLOYMENT_TARGET = 13.0/g' ios/Runner.xcodeproj/project.pbxproj
      - name: Izin iOS (kamera, Bluetooth)
        run: |
          P=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string Scan QR palet" $P || true
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothAlwaysUsageDescription string Membaca timbangan lewat Bluetooth" $P || true
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothPeripheralUsageDescription string Membaca timbangan lewat Bluetooth" $P || true
      - run: flutter pub get
      - name: Build iOS (error diringkas ke anotasi)
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee build.log || {
            echo "::error title=iOS build gagal::$(grep -B2 -A14 -E 'error:|Error|FAILURE|\[!\]' build.log | head -60 | sed 's/%/%25/g' | tr '\n' '|')"
            exit 1
          }
