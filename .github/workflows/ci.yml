name: CI (API, Gateway, Web)

on:
  workflow_dispatch:
  push:
    paths:
      - 'api/**'
      - 'gateway/**'
      - 'web/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: write

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build API
        run: |
          set -o pipefail
          dotnet build api/GudangAtm.Api/GudangAtm.Api.csproj -c Release 2>&1 | tee build.log || {
            echo "::error title=API build gagal::$(grep -E 'error ' build.log | sort -u | head -40 | sed 's/%/%25/g' | tr '\n' '|')"
            exit 1
          }
      - name: Build Gateway
        run: |
          set -o pipefail
          dotnet build gateway/GudangAtm.Gateway/GudangAtm.Gateway.csproj -c Release 2>&1 | tee build2.log || {
            echo "::error title=Gateway build gagal::$(grep -E 'error ' build2.log | sort -u | head -40 | sed 's/%/%25/g' | tr '\n' '|')"
            exit 1
          }

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Typecheck web
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee tc.log || {
            echo "::error title=Web typecheck gagal::$(grep -E 'error' tc.log | head -40 | sed 's/%/%25/g' | tr '\n' '|')"
            exit 1
          }
      - name: Build web
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log || {
            echo "::error title=Web build gagal::$(grep -E 'error|Error' build.log | head -40 | sed 's/%/%25/g' | tr '\n' '|')"
            exit 1
          }
      # Server hanya menjalankan dotnet publish (tanpa Node): hasil build web disimpan ke api/GudangAtm.Api/wwwroot di repo.
      - name: Simpan hasil build web ke wwwroot (main)
        if: github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          git add -A api/GudangAtm.Api/wwwroot
          if git diff --cached --quiet; then echo "wwwroot sudah terbaru"; exit 0; fi
          git -c user.name=ci -c user.email=ci@local commit -qm "Web: perbarui wwwroot hasil build [skip ci]"
          git push -q origin HEAD:main
