name: App - gambar layar (widget test)
on:
  workflow_dispatch:
  push:
    paths: ['app/**', '.github/workflows/app-screens.yml']
permissions:
  contents: write
jobs:
  screens:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '3.24.5' }
      - run: flutter pub get
      - name: Gambar layar
        run: |
          mkdir -p test/goldens
          flutter test test/shell_screens_test.dart --update-goldens 2>&1 | tee test.log || true
          echo "::warning title=hasil::$(grep -A30 'ERRORS(' test.log | head -30 | tr '\n' '|')"
          echo "::warning title=gagal::$(grep -E 'Error|Exception|failed' test.log | head -20 | tr '\n' '|')"
      - uses: actions/upload-artifact@v4
        with: { name: layar, path: app/test/goldens }
      - name: Simpan gambar ke branch layar (untuk dibaca tanpa unduh artifact)
        working-directory: app/test/goldens
        run: |
          git init -q -b layar && git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm "layar ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" layar
